# gitleaks: the default rules, plus one path allowlist.
# server/test/helpers/rfc7515-vectors.json holds the example keys published in
# RFC 7515 Appendix A.2/A.3. They are public known-answer test vectors for JWT
# signing (server/test/push-providers.test.js), not secrets.
[extend]
useDefault = true

#
# The one regex is the fixed example password typed by the iOS registration and
# account-deletion unit tests (mobile/ios/CentyChatTests); it is not a credential
# of any real account.
[allowlist]
description = "Public RFC 7515 JWS test vectors and the iOS tests' example password (not secrets)"
paths = [
  '''^server/test/helpers/rfc7515-vectors\.json$''',
]
regexes = [
  '''^Str0ng-Passw0rd$''',
]
