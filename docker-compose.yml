# Имена служб, томов, контейнеров, образа и базы (mychat-*, openmychat-*,
# mychat) — идентификаторы уже развёрнутых серверов: по именам томов compose
# находит их данные. С переименованием продукта в CentyChat они не менялись —
# не переименовывать, иначе сервер поднимется с пустыми томами.
services:
  # ── Учётные записи ────────────────────────────────────────────────────────
  # Люди, роли, подразделения, привязки устройств и журнал действий живут
  # здесь. Переписка — отдельно, в SQLite внутри тома mychat-data.
  #
  # Разделение сделано намеренно: в админ-панели есть студия базы данных с
  # выполнением произвольного SQL и скачиванием резервных копий. Пока учётные
  # записи лежали в том же файле, это означало, что хэши паролей достижимы
  # одним запросом из веб-интерфейса.
  mychat-db:
    image: postgres:16-alpine
    container_name: openmychat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mychat
      POSTGRES_USER: mychat
      # ОБЯЗАТЕЛЬНО задать до первого запуска: значения по умолчанию здесь нет
      # намеренно — контейнер просто не поднимется, и это лучше, чем поднявшийся
      # с общеизвестным паролем.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - mychat-db-data:/var/lib/postgresql/data
    # Порт наружу не публикуется: до базы достаточно дотянуться серверу по
    # внутренней сети Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mychat -d mychat"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  mychat-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmychat-server:latest
    container_name: openmychat-server
    restart: unless-stopped
    depends_on:
      mychat-db:
        condition: service_healthy
    ports:
      - "2004:2004"
    environment:
      PORT: "2004"
      HOST: "0.0.0.0"

      # Хранилище учётных записей. Без этой переменной сервер поднимется на
      # запасном хранилище SQLite — это рассчитано на разработку, а не на
      # рабочую установку.
      #
      # Трафик не выходит за пределы внутренней сети Docker, поэтому TLS здесь
      # выключен. При вынесении базы на отдельный узел уберите DATABASE_SSL —
      # тогда включится TLS с проверкой сертификата.
      DATABASE_URL: "postgresql://mychat:${POSTGRES_PASSWORD}@mychat-db:5432/mychat"
      DATABASE_SSL: "disable"
      # Optional: pin a JWT secret across container recreations instead of
      # relying on the auto-generated file in the data volume. Either works
      # as long as ./data below is a real persistent volume — set this only
      # if you specifically want the secret to live outside the volume too.
      # JWT_SECRET: "replace-with-a-long-random-value"
      BACKUP_INTERVAL_HOURS: "24"

      # Исходящая почта. Пусто — отправка писем отключена (сервер скажет об
      # этом в журнале). Значения задаются в .env, см. .env.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      BACKUP_RETENTION_COUNT: "14"

      # ── Access control (fill in before exposing this beyond a office LAN) ──
      # Only takes effect on the very FIRST boot against an empty data volume
      # (creates the admin account) — has no effect on an already-seeded
      # database. Set it here once, then you can remove it again.
      INITIAL_ADMIN_NAME: "Тамерлан"
      # Пароль первого входа. Служит ровно один раз: must_change_password
      # заставит сменить его сразу, и новый уже обязан быть не короче восьми
      # символов. Задаётся в .env рядом с паролем базы.
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?задайте INITIAL_ADMIN_PASSWORD в .env}
      #
      # Comma-separated IPv4 addresses/CIDR ranges allowed to reach the
      # server AT ALL — everything else gets a flat 403 before hitting any
      # route (login page included). Empty/unset = open to everyone, which is
      # only appropriate for a trusted LAN-only deployment. This is the
      # control that stops someone who got hold of the installer from
      # logging in from a personal computer with valid credentials.
      # ALLOWED_CLIENT_IPS: "87.255.197.10,192.168.10.0/24"
      #
      # Only set this if you put nginx/Caddy in front for HTTPS (see the
      # reverse-proxy discussion): the proxy's own IP, so its
      # X-Forwarded-For header is trusted for the check above. Leave unset
      # while the container is reachable directly, as in this compose file —
      # otherwise ALLOWED_CLIENT_IPS could be bypassed by forging that header.
      # TRUSTED_PROXY_IPS: "127.0.0.1"
    volumes:
      # THE single copy of the company's data (DB, uploads, backups, the
      # auto-generated JWT secret) lives here, on the host, outside the
      # container. Never delete this volume without a backup — `docker
      # compose down -v` would wipe it.
      - mychat-data:/app/server/data

    # ── Container hardening ──
    # Everything except the mounted data volume is read-only: even if the
    # Node process were compromised, it cannot modify its own code or
    # install anything into the image filesystem.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  # Переписка, вложения, резервные копии и локальный секрет подписи токенов.
  mychat-data:
  # Учётные записи. Отдельный том — отдельная судьба: восстановление переписки
  # из резервной копии не должно откатывать список сотрудников и их пароли.
  mychat-db-data:
