<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Нет связи с сервером</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f1f5f9; color: #0f172a;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: min(520px, calc(100% - 48px));
    background: #fff; border: 1px solid #cbd5e1; border-radius: 12px;
    padding: 32px 32px 24px; box-shadow: 0 8px 24px rgba(15, 23, 42, .08);
  }
  .icon { width: 44px; height: 44px; color: #dc2626; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .reason { margin: 0 0 12px; color: #334155; word-break: break-word; }
  .server { margin: 0 0 20px; color: #64748b; font-size: 12px; word-break: break-all; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #2563eb;
    border: 1px solid #1d4ed8; border-radius: 8px; padding: 8px 20px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { opacity: .6; cursor: default; }
  .status { margin: 16px 0 0; color: #64748b; font-size: 12px; min-height: 18px; }
</style>
</head>
<body>
  <main class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M1 1l22 22"></path>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <path d="M12 20h.01"></path>
    </svg>
    <h1>Нет связи с сервером</h1>
    <p class="reason" id="reason"></p>
    <p class="server">Сервер: <span id="server"></span></p>
    <button id="retry" type="button">Повторить</button>
    <p class="status" id="status" role="status"></p>
  </main>
<script>
  // Текст подставляется через textContent: причина приходит из описания
  // сетевой ошибки, и разметкой она быть не должна.
  (function () {
    var params = new URLSearchParams(location.search);
    var reasonEl = document.getElementById('reason');
    var statusEl = document.getElementById('status');
    var button = document.getElementById('retry');
    var api = window.electronAPI;
    var seconds = Number(params.get('retry')) || 7;
    var autoText = 'Приложение само проверяет связь каждые ' + seconds + ' с и откроется, как только сервер ответит.';

    reasonEl.textContent = params.get('reason') || 'Сервер недоступен.';
    document.getElementById('server').textContent = params.get('server') || '';
    statusEl.textContent = autoText;

    if (api && typeof api.onOfflineStatus === 'function') {
      api.onOfflineStatus(function (info) {
        if (info && info.error) statusEl.textContent = info.error + '. ' + autoText;
      });
    }

    button.addEventListener('click', function () {
      if (!api || typeof api.retryServerConnection !== 'function') return;
      button.disabled = true;
      statusEl.textContent = 'Проверяем связь…';
      api.retryServerConnection().then(function (result) {
        statusEl.textContent = result && result.ok
          ? 'Сервер доступен, подключаемся…'
          : ((result && result.error) || 'Сервер пока недоступен') + '. ' + autoText;
      }).catch(function () {
        statusEl.textContent = autoText;
      }).then(function () {
        button.disabled = false;
      });
    });
  })();
</script>
</body>
</html>
