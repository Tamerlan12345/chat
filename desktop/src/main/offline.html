<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Нет связи с сервером</title>
<style>
  :root { color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: light-dark(#eceef1, #1d1e21); color: light-dark(#2a2d32, #dcdee2);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: min(520px, calc(100% - 48px));
    background: light-dark(#ffffff, #33363b); border: 1px solid light-dark(rgba(17, 24, 39, .09), rgba(255, 255, 255, .09)); border-radius: 14px;
    padding: 32px 32px 24px; box-shadow: 0 18px 44px light-dark(rgba(15, 23, 42, .12), rgba(0, 0, 0, .45));
  }
  .icon { width: 44px; height: 44px; color: light-dark(#b4232a, #ff8b8b); margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; color: light-dark(#15171a, #f2f3f5); font-weight: 600; }
  .reason { margin: 0 0 12px; color: light-dark(#484d55, #b5b9bf); word-break: break-word; }
  .server { margin: 0 0 20px; color: light-dark(#6a7079, #969ba3); font-size: 12px; word-break: break-all; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #2f6bec;
    border: 1px solid #2f6bec; border-radius: 8px; padding: 8px 20px; cursor: pointer;
  }
  button:hover { background: light-dark(#2559cf, #4580f2); border-color: light-dark(#2559cf, #4580f2); }
  button:focus-visible { outline: 2px solid light-dark(#2156c9, #8fb4ff); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: default; }
  .status { margin: 16px 0 0; color: light-dark(#6a7079, #969ba3); font-size: 12px; min-height: 18px; }
</style>
</head>
<body>
  <main class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M1 1l22 22"></path>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <path d="M12 20h.01"></path>
    </svg>
    <h1>Нет связи с сервером</h1>
    <p class="reason" id="reason"></p>
    <p class="server">Сервер: <span id="server"></span></p>
    <button id="retry" type="button">Повторить</button>
    <p class="status" id="status" role="status"></p>
  </main>
<script>
  // Как в приложении: с 6:00 до 15:00 светлая тема, иначе тёмная.
  (function () { var h = new Date().getHours(); if (h >= 6 && h < 15) document.documentElement.dataset.theme = "light"; })();

  // Текст подставляется через textContent: причина приходит из описания
  // сетевой ошибки, и разметкой она быть не должна.
  (function () {
    var params = new URLSearchParams(location.search);
    var reasonEl = document.getElementById('reason');
    var statusEl = document.getElementById('status');
    var button = document.getElementById('retry');
    var api = window.electronAPI;
    var seconds = Number(params.get('retry')) || 7;
    var autoText = 'Приложение само проверяет связь каждые ' + seconds + ' с и откроется, как только сервер ответит.';

    reasonEl.textContent = params.get('reason') || 'Сервер недоступен.';
    document.getElementById('server').textContent = params.get('server') || '';
    statusEl.textContent = autoText;

    if (api && typeof api.onOfflineStatus === 'function') {
      api.onOfflineStatus(function (info) {
        if (info && info.error) statusEl.textContent = info.error + '. ' + autoText;
      });
    }

    button.addEventListener('click', function () {
      if (!api || typeof api.retryServerConnection !== 'function') return;
      button.disabled = true;
      statusEl.textContent = 'Проверяем связь…';
      api.retryServerConnection().then(function (result) {
        statusEl.textContent = result && result.ok
          ? 'Сервер доступен, подключаемся…'
          : ((result && result.error) || 'Сервер пока недоступен') + '. ' + autoText;
      }).catch(function () {
        statusEl.textContent = autoText;
      }).then(function () {
        button.disabled = false;
      });
    });
  })();
</script>
</body>
</html>
