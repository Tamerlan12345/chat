<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Уведомление MyChat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 6px;
    }
    .toast-card {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-left: 4px solid #38bdf8;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 12px;
      cursor: pointer;
      color: #f8fafc;
      animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
    }
    .toast-card.urgent {
      border-color: rgba(244, 63, 94, 0.6);
      border-left-color: #f43f5e;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(244, 63, 94, 0.3);
    }
    .toast-card.announcement {
      border-color: rgba(245, 158, 11, 0.6);
      border-left-color: #f59e0b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(245, 158, 11, 0.3);
    }
    .toast-card:hover {
      background: rgba(30, 41, 59, 0.98);
      border-color: rgba(56, 189, 248, 0.7);
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .sender-name {
      font-weight: 600;
      font-size: 13px;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .body-text {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .close-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s;
    }
    .close-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.1);
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div id="card" class="toast-card">
    <div id="avatar" class="avatar">C</div>
    <div class="content">
      <div class="header-row">
        <span id="title" class="sender-name">Новое сообщение</span>
        <span id="badge" class="badge">Centras</span>
      </div>
      <div id="body" class="body-text">Текст сообщения...</div>
    </div>
    <div id="closeBtn" class="close-btn">&times;</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let toastData = null;
    let autoCloseTimer = null;

    ipcRenderer.on('render-toast', (event, data) => {
      toastData = data;
      document.getElementById('title').textContent = data.title || 'Centras Chat';
      document.getElementById('body').textContent = data.body || '';
      
      const card = document.getElementById('card');
      const avatar = document.getElementById('avatar');
      const badge = document.getElementById('badge');

      if (data.isUrgent) {
        card.classList.add('urgent');
        badge.textContent = 'СРОЧНО';
        badge.style.color = '#f43f5e';
      } else if (data.type === 'announcement') {
        card.classList.add('announcement');
        badge.textContent = 'ОПОВЕЩЕНИЕ';
        badge.style.color = '#f59e0b';
      } else if (data.type === 'rd') {
        card.classList.add('urgent');
        badge.textContent = 'ЭКРАН';
        badge.style.color = '#a855f7';
      }

      if (data.avatarText) {
        avatar.textContent = data.avatarText;
      } else if (data.title) {
        avatar.textContent = data.title.substring(0, 2).toUpperCase();
      }

      // Play soft chime in toast window
      playChime(data.isUrgent);

      // Start auto-close timer (5.5 seconds)
      startAutoClose();
    });

    function playChime(urgent) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (urgent) {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(659.25, ctx.currentTime); // E5
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12); // A5
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.5);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.1); // G5
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.45);
        }
      } catch (e) {
        // AudioContext policy fallback
      }
    }

    function startAutoClose() {
      clearTimeout(autoCloseTimer);
      autoCloseTimer = setTimeout(() => {
        dismiss();
      }, 5500);
    }

    function dismiss() {
      const card = document.getElementById('card');
      card.style.animation = 'slideOut 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards';
      setTimeout(() => {
        ipcRenderer.send('toast-close');
      }, 250);
    }

    document.getElementById('card').addEventListener('mouseenter', () => {
      clearTimeout(autoCloseTimer);
    });

    document.getElementById('card').addEventListener('mouseleave', () => {
      startAutoClose();
    });

    document.getElementById('card').addEventListener('click', (e) => {
      if (e.target.id === 'closeBtn') {
        e.stopPropagation();
        dismiss();
        return;
      }
      ipcRenderer.send('toast-clicked', toastData);
      dismiss();
    });

    document.getElementById('closeBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      dismiss();
    });
  </script>
</body>
</html>
