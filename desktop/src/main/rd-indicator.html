<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Удалённый доступ</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #7f1d1d; color: #fff;
    font: 13px/1.3 "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  .bar {
    height: 100%; box-sizing: border-box; padding: 0 10px 0 14px;
    display: flex; align-items: center; gap: 10px;
    -webkit-app-region: drag;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #f87171; flex: none;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  .text { flex: 1; min-width: 0; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode { font-size: 11px; opacity: .85; }
  button {
    -webkit-app-region: no-drag;
    font: inherit; font-weight: 600; border-radius: 6px; padding: 5px 10px; cursor: pointer; flex: none;
  }
  .open { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5); }
  .stop { background: #fff; color: #7f1d1d; border: 1px solid #fff; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot" aria-hidden="true"></span>
    <div class="text">
      <div class="title" id="title"></div>
      <div class="mode" id="mode"></div>
    </div>
    <button class="open" id="open" type="button">Открыть</button>
    <button class="stop" id="stop" type="button">Завершить доступ</button>
  </div>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var title = params.get('text') || 'Ваш рабочий стол просматривают';
    document.getElementById('title').textContent = title;
    document.getElementById('title').title = title;
    document.getElementById('mode').textContent = params.get('mode') === 'full'
      ? 'Разрешено управление мышью и клавиатурой'
      : 'Только просмотр';

    var api = window.rdIndicator;
    var stop = document.getElementById('stop');
    stop.addEventListener('click', function () {
      if (!api) return;
      stop.disabled = true;
      stop.textContent = 'Завершаем…';
      api.stop();
    });
    document.getElementById('open').addEventListener('click', function () {
      if (api) api.open();
    });
  })();
</script>
</body>
</html>
