name: mobile-android

on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'mobile/contracts/**'
      - '.github/workflows/mobile-android.yml'
  push:
    paths:
      - 'mobile/android/**'
      - 'mobile/contracts/**'
      - '.github/workflows/mobile-android.yml'

permissions:
  contents: read

jobs:
  android-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Verify Android client
        run: |
          chmod +x mobile/android/gradlew
          mobile/android/gradlew -p mobile/android --no-daemon testDebugUnitTest lint assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Upload Android verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-verify-artifacts
          if-no-files-found: warn
          path: |
            mobile/android/app/build/test-results
            mobile/android/app/build/reports/lint-results-*.html
            mobile/android/app/build/outputs/apk

  # Instrumented tests (Compose UI) on a real emulator, with screen recording in <=180 s segments.
  android-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run androidTest on an emulator (recorded)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          script: bash mobile/android/scripts/run-ui-tests-recorded.sh
      - name: Upload UI test video
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-ui-video
          if-no-files-found: warn
          retention-days: 7
          path: mobile/android/build/video/*.mp4
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-instrumented-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            mobile/android/app/build/reports/androidTests
            mobile/android/app/build/outputs/androidTest-results
