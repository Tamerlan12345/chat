name: mobile-ios

on:
  pull_request:
    paths:
      - 'mobile/ios/**'
      - 'mobile/qa/verify-ios-privacy-manifest.ps1'
      - '.github/workflows/mobile-ios.yml'
  push:
    paths:
      - 'mobile/ios/**'
      - 'mobile/qa/verify-ios-privacy-manifest.ps1'
      - '.github/workflows/mobile-ios.yml'

permissions:
  contents: read

jobs:
  ios-simulator-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate iOS privacy manifest
        shell: pwsh
        run: ./mobile/qa/verify-ios-privacy-manifest.ps1
      - name: Run unsigned iOS simulator tests
        run: |
          mkdir -p mobile/ios/build
          xcodebuild \
            -project mobile/ios/CentyChat.xcodeproj \
            -scheme CentyChat \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath mobile/ios/build/CentyChat.xcresult \
            clean test \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS test result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-test-results
          if-no-files-found: warn
          path: mobile/ios/build/CentyChat.xcresult
      - name: Export screenshot attachments as PNG
        if: always() && github.event_name == 'push'
        run: python3 mobile/ios/scripts/export-xcresult-screenshots.py mobile/ios/build/CentyChat.xcresult mobile/ios/build/screenshots
      - name: Upload exported screenshots
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-screenshots
          if-no-files-found: ignore
          path: mobile/ios/build/screenshots/*.png

  # Publishes the PNGs to the orphan branch `ci/ios-screenshots` under <short-sha>/
  # so they can be read through the contents API without downloading artifacts.
  publish-ios-screenshots:
    needs: ios-simulator-tests
    if: always() && github.event_name == 'push' && needs.ios-simulator-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ios-screenshots-publish
      cancel-in-progress: false
    steps:
      - name: Download exported screenshots
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-screenshots
          path: screenshots
      - name: Commit screenshots to ci/ios-screenshots
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          shots=(screenshots/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "No screenshots exported; nothing to publish."
            exit 0
          fi
          short_sha="${SHA::7}"
          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          # ls-remote exits 2 only when the branch is absent; any other failure stops the job.
          set +e
          git -C "$work" ls-remote --exit-code --heads origin ci/ios-screenshots > /dev/null
          remote_status=$?
          set -e
          if [ "$remote_status" -eq 0 ]; then
            git -C "$work" fetch -q --depth=1 origin ci/ios-screenshots
            git -C "$work" checkout -q -b ci/ios-screenshots FETCH_HEAD
          elif [ "$remote_status" -eq 2 ]; then
            git -C "$work" checkout -q --orphan ci/ios-screenshots
          else
            echo "Could not query ci/ios-screenshots (exit $remote_status)" >&2
            exit "$remote_status"
          fi
          rm -rf "${work:?}/${short_sha}"
          mkdir -p "$work/$short_sha"
          cp "${shots[@]}" "$work/$short_sha/"
          git -C "$work" add "$short_sha"
          if git -C "$work" diff --cached --quiet; then
            echo "Screenshots for $short_sha already published."
            exit 0
          fi
          git -C "$work" commit -q -m "ci(ios): screenshots for ${short_sha}"
          git -C "$work" push -q origin HEAD:refs/heads/ci/ios-screenshots
          echo "Published ${#shots[@]} screenshot(s) to ci/ios-screenshots/${short_sha}"
