name: mobile-ios

on:
  pull_request:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/mobile-ios.yml'
  push:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/mobile-ios.yml'

permissions:
  contents: read

jobs:
  ios-simulator-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run unsigned iOS simulator tests
        run: |
          mkdir -p mobile/ios/build
          xcodebuild \
            -project mobile/ios/CentyChat.xcodeproj \
            -scheme CentyChat \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath mobile/ios/build/CentyChat.xcresult \
            clean test \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload iOS test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-results
          if-no-files-found: warn
          path: mobile/ios/build/CentyChat.xcresult
