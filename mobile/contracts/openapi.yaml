      operationId: adminApproveRegistration
      tags:
        - AdminRegistrations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'

  /admin/registrations/{id}/reject:
    post:
      summary: Отклонение заявки на регистрацию
      operationId: adminRejectRegistration
      tags:
