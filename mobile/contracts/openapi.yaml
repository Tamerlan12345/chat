openapi: 3.1.0
info:
  title: CentyChat Corporate Messenger REST API
  version: 1.0.0
  description: |
    Спецификация REST API корпоративного защищённого мессенджера CentyChat.
    Включает эндпоинты аутентификации, привязки устройств, профилей пользователей,
    оргструктуры, каналов, личных и групповых сообщений, оповещений, файлов,
    настроек и консоли администрирования.
    
    Спецификация полностью отражает серверную реализацию CentyChat (`server/src/api/index.js`,
    `server/src/app.js`, `server/src/files/policy-router.js`, `server/src/updates/admin-router.js`,
    `server/src/updates/router.js`).
servers:
  - url: http://localhost:2004/api
    description: Локальный сервер разработки / корпоративная сеть
  - url: https://chat.centras.kz/api
    description: Рабочий сервер АО СК «Сентрас Иншуранс»
paths:
  /health:
    get:
      summary: Проверка состояния сервера
      description: |
        Базовый опрос состояния. Анонимным клиентам отдаётся только статус `ok` (или 503 `starting` при старте).
        С действующим токеном супер-администратора возвращаются подробные сведения о среде и времени работы.
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Сервер работает нормально
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HealthStatusPublic'
                  - $ref: '#/components/schemas/HealthStatusPrivileged'
        '503':
          description: Сервер запускается или хранилище учетных записей недоступно
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: starting
                  error:
                    type: string
                    example: Сервер запускается, повторите через несколько секунд

  /auth/knock:
    post:
      summary: Регистрация / приветствие узла (device knock)
      description: |
        Клиент стучится при запуске. Если устройство уже привязано администратором к сотруднику
        и передан верный `device_secret`, возвращается сессионный токен и профиль сотрудника.
        Иначе узел встаёт в очередь неподтверждённых устройств (`pending_devices`).
      operationId: knockDevice
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnockRequest'
      responses:
        '200':
          description: Результат обработки запроса устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnockResponse'
        '400':
          description: Ошибка валидации параметров узла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен лимит запросов (очередь устройств переполнена либо флуд-контроль)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/device/claim:
    post:
      summary: Подтверждение владения устройством и получение секрета
      description: |
        Вызывается сразу после успешного входа по паролю (`amr: pwd`, не старше 300 секунд).
        Клиент генерирует случайный 256-битный секрет и привязывает его отпечаток к устройству на сервере.
      operationId: claimDeviceSecret
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceClaimRequest'
      responses:
        '200':
          description: Результат привязки секрета устройства
          content:
            application/json:
              schema:
                type: object
                required:
                  - claimed
                properties:
                  claimed:
                    type: boolean
                    example: true
        '403':
          description: Требуется недавний вход по паролю (amr=pwd, auth_time <= 300с)
          content:
            application/json:
              schema:
                type: object
                required:
                  - claimed
                  - error
                properties:
                  claimed:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Требуется недавний вход по паролю

  /auth/device/unbind:
    post:
      summary: Отзыв секрета устройства текущего пользователя
      description: |
        Снимает секрет беспарольного входа для указанного устройства текущего пользователя.
        Привязка самого устройства к сотруднику остаётся активной.
      operationId: unbindDeviceSecret
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUnbindRequest'
      responses:
        '200':
          description: Секрет успешно сброшен
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/login:
    post:
      summary: Аутентификация по логину и паролю
      description: |
        Проверка учетных данных пользователя. При успешной проверке возвращается JWT токен
        и полный профиль сотрудника. Защищено тройным троттлингом (по IP, по паре IP+логин,
        суточные корзины попыток).
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Неверные учетные данные или валидация логина
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Слишком много неудачных попыток входа
          headers:
            Retry-After:
              schema:
                type: integer
              description: Количество секунд до повторной попытки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Очередь хэширования паролей scrypt перегружена
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      summary: Подача заявки на самостоятельную регистрацию
      description: |
        Доступно только при включенной настройке `allow_registration: 'true'`.
        Создает заявку в статусе `pending`. Вход становится возможен только после
        одобрения администратором.
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Заявка успешно подана
          content:
            application/json:
              schema:
                type: object
                required:
                  - pending
                  - message
                properties:
                  pending:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Заявка отправлена. Вход станет возможен после подтверждения администратором.
        '400':
          description: Ошибка валидации полей заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Самостоятельная регистрация отключена администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Превышен лимит заявок на регистрацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Сервер занят расчетом хэшей
          headers:
            Retry-After:
              schema:
                type: integer

  /auth/refresh:
    post:
      summary: Продление сессионного токена
      description: |
        Выдаёт новый токен JWT взамен **ещё действующего**. Старый токен отзывается сразу.
        Активные сокеты переключаются на новый токен. Истёкший или отозванный токен продлить
        нельзя (401): нужен вход по паролю или `/auth/knock` с секретом устройства.
      operationId: refreshToken
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Новый токен успешно выпущен
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                properties:
                  token:
                    type: string
                    description: Свежий подписанный JWT токен
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/MustChangePasswordError'

  /auth/logout:
    post:
      summary: Выход из системы
      description: |
        Отзывает текущий JWT токен (заносит jti в `revoked_tokens`) и принудительно
        закрывает все сокеты, авторизованные этим токеном. Опционально отвязывает
        секрет устройства (`device_id`).
      operationId: logout
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  description: Идентификатор устройства для отвязки секрета
                  example: device-uuid-1234
      responses:
        '200':
          description: Выход выполнен успешно
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      summary: Получение профиля текущего пользователя
      description: Возвращает полную информацию об учетной записи текущего пользователя.
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль текущего пользователя
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users:
    get:
      summary: Справочник сотрудников
      description: |
        Возвращает список всех подтвержденных активных пользователей с публичными полями.
      operationId: getUsers
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список сотрудников компании
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/MustChangePasswordError'

  /users/{id}:
    get:
      summary: Получение информации о пользователе по ID
      description: |
        Возвращает полную карточку, если запрашивается свой профиль или профиль запрашивает
        администратор (в рамках своего контура). Для коллег возвращаются только публичные поля.
      operationId: getUserById
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Числовой ID пользователя
      responses:
        '200':
          description: Карточка пользователя
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/MustChangePasswordError'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/profile:
    put:
      summary: Обновление собственного профиля
      description: |
        Позволяет сотруднику изменить контактный email, телефон, фото профиля (data URL до 500 КБ)
        и пользовательский статус. ФИО и должность менять запрещено во избежание спуфинга.
      operationId: updateProfile
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Обновленный профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации формата email, телефона или аватара
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/MustChangePasswordError'

  /users/password:
    post:
      summary: Смена пароля сотрудником
      description: |
        Смена пароля с проверкой текущего старого пароля. При успешной смене отзываются
        все старые сессии (token_version инкрементируется) и возвращается новый сессионный токен.
      operationId: changePassword
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Пароль успешно изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          description: Неверный старый пароль или новый пароль не удовлетворяет политике
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Слишком много попыток смены пароля
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Очередь хэширования занята
          headers:
            Retry-After:
              schema:
                type: integer

  /org/tree:
    get:
      summary: Иерархическое дерево оргструктуры
      description: |
        Возвращает полное дерево подразделений со списками сотрудников, счетчиками состава
        и онлайн-статусами. Для контурного администратора дерево ограничено его контуром.
      operationId: getOrgTree
      tags:
        - Org
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Дерево оргструктуры компании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgTreeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/MustChangePasswordError'

  /org/departments:
    post:
      summary: Создание подразделения
      description: Доступно только суперадминистраторам.
      operationId: createDepartment
      tags:
        - Org
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreateRequest'
      responses:
        '201':
          description: Подразделение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'

  /org/departments/{id}:
    put:
      summary: Редактирование подразделения
      description: Доступно только суперадминистраторам. Проверяет отсутствие циклов в иерархии.
      operationId: updateDepartment
      tags:
        - Org
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdateRequest'
      responses:
        '200':
          description: Подразделение обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'
    delete:
      summary: Удаление подразделения
      description: Доступно только суперадминистраторам. Переносит дочерние отделы выше, сотрудников оставляет без отдела.
      operationId: deleteDepartment
      tags:
        - Org
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Отдел удален
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'

  /org/move-user:
    post:
      summary: Перемещение сотрудника в другое подразделение
      description: Доступно только суперадминистраторам.
      operationId: moveUser
      tags:
        - Org
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - departmentId
              properties:
                userId:
                  type: integer
                  example: 15
                departmentId:
                  type: integer
                  nullable: true
                  example: 3
      responses:
        '200':
          description: Сотрудник перемещен
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'

  /channels:
    get:
      summary: Список каналов пользователя
      description: |
        Возвращает доступные пользователю каналы (все публичные и системные каналы,
        а также приватные, где пользователь является участником).
      operationId: getChannels
      tags:
        - Channels
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список доступных каналов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/MustChangePasswordError'
    post:
      summary: Создание нового канала пользователем
      description: Доступно пользователям с правом `can_create_channels` или `is_admin`.
      operationId: createChannel
      tags:
        - Channels
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreateRequest'
      responses:
        '201':
          description: Канал успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: Нет прав на создание каналов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /conversations/direct:
    get:
      summary: Список личных диалогов (direct messages)
      description: |
        Возвращает список собеседников, с которыми есть реальная переписка, отсортированный
        по времени последнего сообщения, со счетчиками непрочитанных.
      operationId: getDirectConversations
      tags:
        - Messages
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список активных диалогов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectConversation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/MustChangePasswordError'

  /messages:
    get:
      summary: Загрузка истории сообщений (универсальный маршрут)
      description: |
        Позволяет запросить сообщения как для канала (`conversationType: channel`),
        так и для личной беседы (`conversationType: direct`). Проверяет членство в канале.
      operationId: getMessagesGeneric
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: conversationType
          in: query
          required: true
          schema:
            type: string
            enum: [direct, channel]
        - name: targetId
          in: query
          required: true
          schema:
            type: integer
          description: ID канала или ID собеседника
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: beforeId
          in: query
          required: false
          schema:
            type: integer
          description: Загрузить сообщения старше данного messageId (пагинация назад)
        - name: afterId
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: |
            Пагинация ВПЕРЁД: первые `limit` сообщений с `id > afterId`, по возрастанию id.
            `afterId=0` — с самого начала. Только неотрицательное целое (строка из цифр),
            иначе HTTP 400. Совместим с `beforeId` (диапазон). Для догрузки пропущенного
            после переподключения используйте `/sync`, а `afterId` — для одной открытой переписки.
