        - text
        - type
        - created_at
      properties:
        id:
          type: integer
          example: 240
        conversation_type:
          type: string
          enum: [channel, direct]
          example: direct
        target_id:
          type: integer
          description: ID получателя (при direct) или ID канала (при channel)
          example: 12
        sender_id:
          type: integer
          example: 7
        text:
          type: string
          example: 'Привет! Добавил спецификацию в contracts/openapi.yaml'
        type:
          type: string
          enum: [text, file, image]
          example: text
        reply_to_id:
          type: integer
          nullable: true
          example: null
        metadata_json:
          type: string
          nullable: true
          description: JSON строка с метаданными вложения
          example: '{"file_id": 42, "file_name": "spec.pdf", "size": 1048576}'
        created_at:
          type: string
          format: date-time
          example: '2026-09-30T09:20:15.000Z'
        updated_at:
          type: string
          format: date-time
          nullable: true
        is_deleted:
          type: integer
          enum: [0, 1]
          example: 0
        client_msg_id:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: |
            Ключ идемпотентности, присланный автором при отправке (`null`, если не присылался —
            например, настольным клиентом). Есть во всех формах сообщения: REST-ответы, страницы
            истории, `/sync`, WS-кадры. Уникален в пределах автора (`sender_id`), не глобально:
            сопоставлять с локальной очередью только вместе с `sender_id == мой id`.
          example: '6f1d2c3b-4a5e-4f60-8a7b-9c0d1e2f3a4b'
        sender_username:
          type: string
          nullable: true
          example: 'k.akhmetov'
        sender_name:
          type: string
          example: 'Ахметов Канат'
        sender_avatar:
          type: string
          nullable: true
        sender_department:
          type: string
          nullable: true
          example: 'Отдел разработки'
        file_original_name:
          type: string
          nullable: true
          example: 'spec.pdf'
        delivery_status:
          type: string
          nullable: true
          enum: [delivered, read]
          description: |
            Только в страницах истории личной переписки и в `/sync` (в `/sync` у сообщений канала
            всегда `null`). В живых WS-кадрах и ответе POST поля нет. Для своего сообщения —
            статус у собеседника, для входящего — ваш собственный.
          example: read

    SyncResponse:
      type: object
      required: [messages, next_cursor, has_more]
      properties:
        messages:
          type: array
          description: По возрастанию номера изменения; каждое сообщение не больше одного раза.
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type: string
          pattern: '^[0-9]{1,15}$'
          description: Непрозрачный курсор для следующего `since`. Хранить как строку.
          example: '23'
        has_more:
          type: boolean
          description: true — есть ещё изменения, сразу запросить `since=next_cursor`.

    SendMessageRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 16000
          example: 'Сообщение для коллеги'
        type:
          type: string
          enum: [text, file, image]
          default: text
        reply_to_id:
          type: integer
          nullable: true
          example: 238
        metadata:
          type: object
          description: 'Метаданные вложения, например { file_id: 12 }'
          properties:
            file_id:
              type: integer
              example: 42
        client_msg_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          maxLength: 64
          description: |
            Необязательный ключ идемпотентности (рекомендуется UUID v4, генерируется клиентом
            один раз на сообщение и хранится в его очереди отправки). Повтор с тем же ключом
            от того же автора в ту же переписку не создаёт второе сообщение (HTTP 200 и сохранённая
            запись). Тот же ключ у ДРУГОГО автора — независимое сообщение. Не строка, пустая строка,
            длиннее 64 или символы вне `[A-Za-z0-9_-]` — HTTP 400 `INVALID_CLIENT_MSG_ID`.
          example: '0b7e5a91-2c4d-4e6f-9a10-b2c3d4e5f607'

