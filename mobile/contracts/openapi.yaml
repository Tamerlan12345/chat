  /sync:
    get:
      summary: Дельта-синхронизация после переподключения
      description: |
        Всё, что изменилось после курсора `since` во ВСЕХ переписках, видимых пользователю:
        личные — где он отправитель или получатель; каналы — где он участник (`channel_members`,
        то же правило, что у истории канала и поиска). Возвращаются:
        - новые сообщения;
        - отредактированные (новый `text`, непустой `updated_at`);
        - удалённые — надгробием: `is_deleted = 1`, `text = ""`, `metadata_json = null`,
          `file_original_name = null`;
        - личные сообщения, у которых сменился статус доставки/прочтения (`delivery_status`).

        Каждое сообщение — **один раз, в текущем состоянии** (не журнал событий), по возрастанию
        номера изменения. Клиент применяет их как upsert по `id`.

        **Курсор.** `next_cursor` — непрозрачная строка из цифр (сейчас это номер изменения
        `change_seq`: глобальная монотонная последовательность; каждое создание, правка, удаление
        и смена статуса личного сообщения получает следующий номер). Курсор не зависит от времени,
        поэтому одинаковые метки `created_at`/`updated_at` ничего не ломают. Сравнивать курсоры
        или вычислять их на клиенте нельзя — только хранить последний `next_cursor` и передавать
        его в `since`.

        **Начало.** Без `since` — `{ messages: [], next_cursor: <голова>, has_more: false }`.
        Порядок для нового клиента: (1) `GET /sync` без `since` → запомнить курсор; (2) загрузить
        списки и страницы переписок обычными маршрутами; (3) дальше — `GET /sync?since=<курсор>`.
        Изменения между шагами 1 и 2 придут повторно — upsert по `id` это поглощает.
        `since=0` — вся видимая история (постранично).

        **Страницы.** `has_more = true` — сразу запросить следующую страницу с `since = next_cursor`.
        `has_more = false` — изменений больше нет; `next_cursor` = голова на момент ответа
        (не меньше `since`), сохранить его.

        **Что сюда не попадает:** удаление канала целиком (сообщения стираются физически —
        обновите `GET /channels`), прочтение в каналах (`last_read_message_id`, `unread_count` —
        из `GET /channels`), сообщения канала, в который пользователя добавили позже, — с номером
        изменения ниже курсора (загрузить историю канала обычным маршрутом).
      operationId: syncMessages
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{1,15}$'
          description: Последний полученный `next_cursor`. Без параметра — только текущая голова.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
            maximum: 200
          description: Размер страницы; больше 200 урезается до 200. Не целое или < 1 — HTTP 400.
      responses:
        '200':
          description: Страница изменений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          description: Недопустимый `since` или `limit`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '410':
          description: |
            Курсор больше текущей головы (`code: SYNC_CURSOR_INVALID`) — база сервера восстановлена
            из резервной копии или курсор от другого сервера. Сбросить локальный курсор, заново
            `GET /sync` без `since` и перезагрузить открытые переписки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Больше 60 запросов синхронизации в минуту на пользователя. Заголовок `Retry-After` = 60.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

