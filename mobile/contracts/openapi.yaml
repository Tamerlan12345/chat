  /settings/departments:
    get:
      summary: Список подразделений для формы регистрации
      description: |
        Публичный эндпоинт для формы регистрации. Если `allow_registration: false`, возвращает пустой список.
        Кэшируется на сервере на 30 секунд.
      operationId: getRegistrationDepartments
      tags:
        - Settings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - departments
                properties:
                  departments:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: Департамент информационных технологий

  /settings/rd:
    get:
      summary: Настройки удаленного рабочего стола
      description: Возвращает статус включения удаленного стола и список настроенных STUN/TURN ICE-серверов.
      operationId: getRemoteDesktopSettings
      tags:
        - Settings
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteDesktopSettings'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /settings:
    get:
      summary: Получение всех настроек сервера (для администраторов)
      description: Доступно только суперадминистраторам.
      operationId: getAdminSettings
      tags:
        - Settings
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'
    put:
      summary: Обновление настроек сервера
      description: Доступно только суперадминистраторам. Служебные настройки защищены валидацией.
      operationId: updateAdminSettings
      tags:
        - Settings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'

  /admin/users:
    get:
      summary: Список пользователей в панели администрирования
      description: Суперадминистратор видит всех, контурный администратор — сотрудников своего поддерева.
      operationId: adminGetUsers
      tags:
        - AdminUsers
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'
    post:
      summary: Создание нового пользователя администратором
      description: Создает пользователя и сразу добавляет его в общекорпоративные каналы.
      operationId: adminCreateUser
      tags:
        - AdminUsers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'

  /admin/users/{id}:
    put:
      summary: Редактирование пользователя администратором
      description: При изменении роли, контура или блокировке пользователя его активные WebSocket сессии принудительно сбрасываются.
      operationId: adminUpdateUser
      tags:
        - AdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'
    delete:
      summary: Деактивация пользователя (мягкое удаление)
      operationId: adminDeleteUser
      tags:
        - AdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - user
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'

  /admin/users/{id}/toggle-active:
    post:
      summary: Переключение активности пользователя (активен / отключен)
      operationId: adminToggleUserActive
      tags:
        - AdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/ForbiddenAdminError'

  /admin/users/{id}/reset-password:
    post:
      summary: Сброс пароля пользователя администратором
      description: 'Генерирует временный пароль со флагом `must_change_password: 1` или устанавливает заданный.'
      operationId: adminResetPassword
      tags:
        - AdminUsers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Опциональный новый пароль. Если не передан, сервер сгенерирует случайный.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - generated
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  generated:
                    type: boolean
                    example: true
                  password:
                    type: string
                    description: Возвращается только если сгенерирован сервером
                    example: kX9#mP2$vQ
                  message:
                    type: string
                    example: Выдан временный пароль — передайте его сотруднику

  /admin/registrations:
    get:
      summary: Список ожидающих заявок на регистрацию
      operationId: adminGetRegistrations
