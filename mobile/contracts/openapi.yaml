          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /files/upload:
    post:
      summary: Загрузка файла/вложения (multipart/form-data)
      description: |
        Принимает одиночный файл в поле формы `file`. Проверяет квоту сотрудника (МБ/час),
        лимит параллельных загрузок (2), политику разрешенных расширений и магические байты (сигнатуру).
      operationId: uploadFile
      tags:
        - Files
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Файл сохранен на сервере
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: Загрузка файлов не разрешена для текущей роли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Файл превышает установленный администратором максимальный размер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Тип или сигнатура файла заблокированы политикой безопасности
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - code
                properties:
                  error:
                    type: string
                    example: Файлы .exe к отправке не разрешены
                  code:
                    type: string
                    example: ext-not-allowed
        '429':
          description: Превышена часовая квота загрузки или лимит параллельных загрузок
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '507':
          description: Недостаточно свободного места на сервере
          headers:
            Retry-After:
              schema:
                type: integer

  /files/policy:
    get:
      summary: Действующая политика разрешенных файлов для текущего пользователя
      description: |
        Возвращает флаг `enabled` и список разрешенных расширений (с учетом персональных исключений).
        Мобильный клиент использует этот список для локальной фильтрации перед выбором файла.
      operationId: getEffectiveFilePolicy
      tags:
        - Files
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePolicyEffectiveResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /files/download/{id}:
    get:
      summary: Скачивание вложения по ID
      description: |
        Отдает файл строго в виде attachment с жесткими заголовками безопасности
        (CSP sandbox, nosniff, no-store). Доступ проверяется по участию пользователя
        в переписке, содержащей данный `file_id`.
      operationId: downloadFile
      tags:
        - Files
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename*=UTF-8''document.pdf
            Content-Type:
              schema:
                type: string
                example: application/pdf
            Content-Security-Policy:
              schema:
                type: string
                example: default-src 'none'; sandbox
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Доступ запрещен (файл вне ваших диалогов и каналов)
        '404':
          description: Файл не найден

  /files/recent:
    get:
      summary: Недавние файлы пользователя
      description: Список последних загруженных и полученных файлов текущего сотрудника.
      operationId: getRecentFiles
      tags:
        - Files
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentFile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /settings/info:
