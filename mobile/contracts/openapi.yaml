          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /announcements/{id}/acknowledge:
    post:
      summary: Подтверждение прочтения (ознакомления) с оповещением
      description: Фиксирует факт, дату/время и IP-адрес ознакомления сотрудника с важным распоряжением.
      operationId: acknowledgeAnnouncement
      tags:
        - Announcements
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ознакомление подтверждено
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - announcementId
                  - confirmed_at
                properties:
                  success:
                    type: boolean
                    example: true
                  announcementId:
                    type: integer
                    example: 5
                  confirmed_at:
                    type: string
                    format: date-time
                    example: '2026-09-30T09:30:00.000Z'
        '403':
          description: Оповещение не адресовано текущему пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Оповещение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

