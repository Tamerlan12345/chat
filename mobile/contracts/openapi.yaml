      tags:
        - AdminServer
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseInfo'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Сессионный JWT токен CentyChat, подписанный HMAC-SHA256 серверным секретом `JWT_SECRET`.
        Передаётся в стандартном заголовке `Authorization: Bearer <token>`.

  responses:
    UnauthorizedError:
      description: Необходима авторизация или токен недействителен / отозван
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MustChangePasswordError:
      description: Пользователь обязан сменить пароль перед продолжением работы
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - code
            properties:
              error:
                type: string
                example: Требуется смена пароля перед продолжением работы
              code:
                type: string
                example: MUST_CHANGE_PASSWORD
    ForbiddenAdminError:
      description: Доступ запрещен (требуются права администратора)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequestError:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Человекочитаемое описание ошибки
          example: Пользователь не найден
        code:
          type: string
          description: Машиночитаемый код ошибки (опционально)
          example: INVALID_CREDENTIALS

    HealthStatusPublic:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    HealthStatusPrivileged:
      type: object
      required:
        - status
        - version
        - identityStore
        - uptimeSeconds
        - timestamp
      properties:
