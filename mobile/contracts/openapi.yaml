                  $ref: '#/components/schemas/Message'
        '400':
          description: Недопустимый afterId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Отправка прямого сообщения пользователю по HTTP
      description: Сохраняет сообщение в БД и транслирует его получателю и отправителю через WebSocket.
      operationId: sendDirectMessage
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - name: targetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Сообщение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '200':
          description: |
            Повтор отправки: у этого автора уже есть сообщение с таким `client_msg_id` в этой же
            переписке. Ничего не записано, в ответе — уже сохранённая запись (та же `id`; если её
            успели удалить — надгробие `is_deleted = 1`). Получателям повторно не рассылается,
            эхо `direct_message`/`channel_message` + `new_message` уходит только сокетам автора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
